<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Birthday Surprise ❤️</title>

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Poppins',sans-serif;

      background:
      linear-gradient(
      135deg,
      #0f0c29,
      #302b63,
      #24243e);

      color:white;

      min-height:100vh;

      overflow-x:hidden;
      overflow-y:auto;

    }

    /* FLOATING ITEMS */

    .floating{

      position:fixed;

      top:100vh;

      z-index:0;

      opacity:0.8;

      pointer-events:none;

      animation:floatUp linear infinite;

    }

    @keyframes floatUp{

      0%{

        transform:
        translateY(100vh)
        scale(0);

        opacity:0;

      }

      20%{
        opacity:1;
      }

      100%{

        transform:
        translateY(-120vh)
        scale(1.5);

        opacity:0;

      }

    }

    /* SCREEN */

    .screen{

      width:100%;

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      flex-direction:column;

      text-align:center;

      padding:40px 20px;

      position:relative;

      z-index:2;

    }

    /* INTRO */

    #intro h1{

      font-size:48px;

      margin-bottom:20px;

      animation:glow 2s infinite alternate;

    }

    #typing{

      font-size:24px;

      max-width:700px;

      line-height:1.8;

      color:#ffd6e7;

      opacity:0;

      animation:fadeTyping 1.5s forwards;

    }

    @keyframes fadeTyping{

      from{

        opacity:0;

        transform:translateY(15px);

      }

      to{

        opacity:1;

        transform:translateY(0);

      }

    }

    /* CURSOR */

    .cursor{

      display:inline-block;

      margin-left:3px;

      animation:blink 0.8s infinite;

    }

    @keyframes blink{

      0%{
        opacity:1;
      }

      50%{
        opacity:0;
      }

      100%{
        opacity:1;
      }

    }

    /* GLOW */

    @keyframes glow{

      from{

        text-shadow:
        0 0 10px #ff4d88;

      }

      to{

        text-shadow:
        0 0 20px #ff4d88,
        0 0 40px #ff4d88;

      }

    }

    /* BALLOON SCREEN */

    #balloon-section{
      display:none;
    }

    .balloon{

      width:210px;
      height:250px;

      background:#ff3b6b;

      border-radius:50%;

      position:relative;

      cursor:pointer;

      animation:float 2s infinite ease-in-out;

      display:flex;

      justify-content:center;

      align-items:center;

      flex-direction:column;

      box-shadow:
      0 10px 40px
      rgba(255,59,107,0.5);

      transition:all 0.5s ease;

    }

    .balloon::after{

      content:"";

      position:absolute;

      bottom:-70px;

      width:2px;

      height:70px;

      background:white;

    }

    .balloon span{
      font-size:70px;
    }

    .balloon p{

      margin-top:10px;

      font-size:20px;

      padding:0 15px;

    }

    @keyframes float{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-25px);
      }

      100%{
        transform:translateY(0px);
      }

    }

    /* SHAKE */

    @keyframes shake{

      0%{
        transform:translate(0);
      }

      25%{
        transform:translate(5px,-5px);
      }

      50%{
        transform:translate(-5px,5px);
      }

      75%{
        transform:translate(5px,5px);
      }

      100%{
        transform:translate(0);
      }

    }

    /* FINAL SCREEN */

    #final-screen{

      display:none;

      animation:fadeIn 1.5s ease;

      padding-top:70px;

      padding-bottom:70px;

    }

    @keyframes fadeIn{

      from{

        opacity:0;

        transform:scale(0.7);

      }

      to{

        opacity:1;

        transform:scale(1);

      }

    }

    /* PHOTO */

    .photo-container{

      position:relative;

      display:flex;

      justify-content:center;

      align-items:center;

      margin-bottom:20px;

    }

    .photo{

      width:min(280px,70vw);

      aspect-ratio:1/1;

      object-fit:cover;

      border-radius:25px;

      border:5px solid white;

      box-shadow:
      0 0 40px
      rgba(255,255,255,0.4);

    }

    /* FLOWERS */

    .flower{

      position:absolute;

      font-size:55px;

      animation:spin 5s linear infinite;

    }

    .left-flower{
      left:-70px;
    }

    .right-flower{
      right:-70px;
    }

    @keyframes spin{

      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }

    }

    /* HEADING */

    #final-screen h1{

      font-size:52px;

      margin-top:20px;

      margin-bottom:20px;

      animation:glow 2s infinite alternate;

    }

    /* MESSAGE */

    .wish{

      max-width:750px;

      font-size:24px;

      line-height:1.8;

      color:#ffe6f0;

      padding:0 10px;

    }

    /* SLIDESHOW */

    .slideshow{

      margin-top:30px;

      font-size:20px;

      color:#ffb6d0;

      min-height:40px;

      animation:fadeText 2s infinite;

    }

    @keyframes fadeText{

      0%{
        opacity:0;
      }

      50%{
        opacity:1;
      }

      100%{
        opacity:0;
      }

    }

    /* MOBILE */

    @media(max-width:768px){

      body{
        overflow-x:hidden;
      }

      .screen{
        padding:25px 18px;
      }

      /* INTRO */

      #intro h1{

        font-size:30px;

        line-height:1.3;

        margin-bottom:18px;

        padding:0 10px;

      }

      #typing{

        font-size:18px;

        line-height:1.7;

        max-width:100%;

        padding:0 12px;

      }

      /* BALLOON */

      .balloon{

        width:160px;

        height:200px;

      }

      .balloon span{
        font-size:52px;
      }

      .balloon p{

        font-size:16px;

        padding:0 12px;

      }

      .balloon::after{

        height:55px;

        bottom:-55px;

      }

      /* FINAL SCREEN */

      #final-screen{

        padding-top:40px;

        padding-bottom:50px;

      }

      /* PHOTO */

      .photo-container{
        margin-bottom:18px;
      }

      .photo{

        width:78vw;

        max-width:260px;

        border-radius:22px;

        border:4px solid white;

      }

      /* FLOWERS */

      .flower{
        font-size:34px;
      }

      .left-flower{

        left:-18px;

        top:10px;

      }

      .right-flower{

        right:-18px;

        top:10px;

      }

      /* HEADING */

      #final-screen h1{

        font-size:32px;

        line-height:1.3;

        margin-top:15px;

        margin-bottom:18px;

        padding:0 10px;

      }

      /* MESSAGE */

      .wish{

        font-size:18px;

        line-height:1.8;

        max-width:100%;

        padding:0 12px;

      }

      /* SLIDESHOW */

      .slideshow{

        font-size:17px;

        line-height:1.5;

        padding:0 10px;

        margin-top:24px;

        min-height:55px;

      }

      /* FLOATING */

      .floating{
        font-size:22px !important;
      }

    }

  </style>

</head>

<body>

  <!-- INTRO -->

  <div
    id="intro"
    class="screen"
  >

    <h1>
      Someone has a surprise for you ❤️
    </h1>

    <div id="typing"></div>

  </div>

  <!-- BALLOON -->

  <div
    id="balloon-section"
    class="screen"
  >

    <div
      class="balloon"
      id="balloon"
    >

      <span>🎈</span>

      <p>
        Pop to see the magic ✨
      </p>

    </div>

  </div>

  <!-- FINAL SCREEN -->

  <div
    id="final-screen"
    class="screen"
  >

    <div class="photo-container">

      <div class="flower left-flower">
        🌸
      </div>

      <!-- REPLACE IMAGE -->

      <img
        src="mohana2.jpeg"
        class="photo"
        alt="Birthday Girl"
      >

      <div class="flower right-flower">
        🌸
      </div>

    </div>

    <h1>
      Happy Birthday Mohana ❤️ 🧸
    </h1>

    <p class="wish">

      Wishing you endless happiness,
      smiles, love and beautiful memories ✨

      <br><br>

      Stay blessed and keep shining forever 💖

    </p>

    <div
      class="slideshow"
      id="slideText"
    ></div>

  </div>

  <!-- MUSIC -->

  <audio
    id="music"
    src="untill.mpeg"
    loop
  ></audio>

  <script>

    // FLOATING ITEMS

    function createFloatingElements(){

      const items =
      ["❤️","🧸","🌸"];

      setInterval(()=>{

        const element =
        document.createElement("div");

        element.classList.add(
        "floating");

        element.innerHTML =
        items[Math.floor(
        Math.random()*items.length)];

        element.style.left =
        Math.random()*100 + "vw";

        element.style.fontSize =
        Math.random()*25 + 20 + "px";

        element.style.animationDuration =
        Math.random()*5 + 5 + "s";

        document.body.appendChild(
        element);

        setTimeout(()=>{
          element.remove();
        },10000);

      },350);

    }

    createFloatingElements();

    // TYPING EFFECT

    const text =
    "Hey beautiful... ✨ Today is special because someone amazing was born ❤️";

    let index = 0;

    const typingElement =
    document.getElementById(
    "typing");

    function typeText(){

      if(index < text.length){

        typingElement.innerHTML =

        text.substring(
        0,index + 1)

        +

        '<span class="cursor">|</span>';

        index++;

        setTimeout(typeText,100);

      }

      else{

        typingElement.innerHTML =
        text;

        setTimeout(()=>{

          document.getElementById(
          "intro")

          .style.transition =
          "opacity 1.5s ease";

          document.getElementById(
          "intro")

          .style.opacity = "0";

          setTimeout(()=>{

            document.getElementById(
            "intro")

            .style.display = "none";

            document.getElementById(
            "balloon-section")

            .style.display = "flex";

          },1500);

        },2000);

      }

    }

    typeText();

    // BALLOON CLICK

    const balloon =
    document.getElementById(
    "balloon");

    balloon.addEventListener(
    "click",()=>{

      // SHAKE

      document.body.style.animation =
      "shake 0.4s";

      setTimeout(()=>{
        document.body.style.animation =
        "";
      },400);

      // EXPAND

      balloon.style.transform =
      "scale(1.8)";

      // BLAST

      setTimeout(()=>{

        createBlastParticles();

        balloon.style.display =
        "none";

        document.getElementById(
        "balloon-section")

        .style.display = "none";

        document.getElementById(
        "final-screen")

        .style.display = "flex";

        document.getElementById(
        "music").play();

        createConfetti();

      },350);

    });

    // BLAST PARTICLES

    function createBlastParticles(){

      for(let i=0;i<40;i++){

        const particle =
        document.createElement("div");

        particle.innerHTML = "🎈";

        particle.style.position =
        "fixed";

        particle.style.left =
        window.innerWidth/2 + "px";

        particle.style.top =
        window.innerHeight/2 + "px";

        particle.style.fontSize =
        Math.random()*20 + 15 + "px";

        particle.style.zIndex =
        "9999";

        const x =
        (Math.random()-0.5)*800;

        const y =
        (Math.random()-0.5)*800;

        particle.animate([

          {
            transform:
            "translate(0,0) scale(1)",
            opacity:1
          },

          {
            transform:
            `translate(${x}px,${y}px)
            scale(0)`,
            opacity:0
          }

        ],{

          duration:1200,

          easing:"ease-out"

        });

        document.body.appendChild(
        particle);

        setTimeout(()=>{
          particle.remove();
        },1200);

      }

    }

    // CONFETTI

    function createConfetti(){

      for(let i=0;i<150;i++){

        const confetti =
        document.createElement("div");

        confetti.style.position =
        "absolute";

        confetti.style.width =
        "10px";

        confetti.style.height =
        "10px";

        confetti.style.background =

        `hsl(
        ${Math.random()*360},
        100%,
        50%)`;

        confetti.style.left =

        Math.random()*
        window.innerWidth + "px";

        confetti.style.top =
        "-20px";

        confetti.style.borderRadius =
        "50%";

        confetti.style.animation =

        `fall
        ${2+Math.random()*3}s
        linear forwards`;

        document.body.appendChild(
        confetti);

        setTimeout(()=>{
          confetti.remove();
        },5000);

      }

    }

    // FALL

    const style =
    document.createElement("style");

    style.innerHTML = `

      @keyframes fall{

        to{

          transform:

          translateY(110vh)

          rotate(720deg);

          opacity:0;

        }

      }

    `;

    document.head.appendChild(style);

    // SLIDESHOW

    const messages = [

      "Your smile is literally magical ✨",

      "Today is all about you ❤️",

      "Stay happy forever 💖",

      "You deserve the best in life 🌸",

      "Keep shining beautiful 🌙"

    ];

    let msgIndex = 0;

    setInterval(()=>{

      document.getElementById(
      "slideText")

      .innerHTML =
      messages[msgIndex];

      msgIndex =

      (msgIndex + 1)

      %

      messages.length;

    },2500);

  </script>

</body>

</html>
